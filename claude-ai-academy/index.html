<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Claude AI Academy for SAP Developers — learn Claude AI, integrate it into your daily SAP work, and become productive with real-world ABAP scenarios."
    />
    <title>Claude AI Academy for SAP Developers</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem("academy-theme");
          var dark =
            t === "dark" ||
            (t !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
