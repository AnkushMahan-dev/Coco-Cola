# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
specVersion: "4.0"
metadata:
  name: ccbji.otc.stlmnt
type: application
framework:
  name: SAPUI5
  version: 1.136.10
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.fe.templates
    - name: sap.ushell
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    # fiori-tools-preview generates the FLP sandbox itself (served at
    # /test/flpSandbox.html). Do NOT place a static flpSandbox.html in
    # webapp/test - it shadows this generated one and loads the FE component
    # with "manifest": false (-> getMetaModel undefined crash).
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        # RISE dev cert is self-signed / "Not secure" -> Node rejects it
        # unless cert errors are ignored (dev only).
        ignoreCertErrors: true
        backend:
          - path: /sap
            # The reachable endpoint is HTTPS on 44300 (confirmed by the
            # service test client), NOT http on 8000 which resets (ECONNRESET).
            url: https://vhc2jq4rci.rise.ccbji.co.jp:44300
            client: "100"
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
